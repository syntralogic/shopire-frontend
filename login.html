<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – SHOPIRE</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/login.css"/>
</head>
<body>
  <script src="js/shopire-nav.js" defer></script>

  <div class="page-wrap">
    <div class="auth-card">
      <div class="auth-top">
        <div class="auth-logo">
          <div class="auth-logo-icon"><i class="fas fa-bolt"></i></div>
          SHOPIRE
        </div>
        <p>Pakistan's Best Electronics Store</p>
      </div>
      <div class="auth-body">
        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('login')">Login</button>
          <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- LOGIN -->
        <div class="tab-panel active" id="loginPanel">
          <div class="msg" id="loginMsg"></div>
          <div class="form-group">
            <label>Email Address</label>
            <div class="input-wrap">
              <i class="fas fa-envelope"></i>
              <input type="email" id="loginEmail" placeholder="Enter your email"/>
            </div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="input-wrap">
              <i class="fas fa-lock"></i>
              <input type="password" id="loginPassword" placeholder="password"/>
            </div>
          </div>
          <div class="forgot"><a href="#">Forgot Password?</a></div>
          <button class="btn-auth" id="loginBtn" onclick="doLogin()">
            <i class="fas fa-sign-in-alt"></i> Login
          </button>
          <p class="auth-footer">Don't have an account? <a onclick="switchTab('signup')" style="cursor:pointer">Sign Up</a></p>
        </div>

        <!-- SIGNUP -->
        <div class="tab-panel" id="signupPanel">
          <div class="msg" id="signupMsg"></div>
          <div class="form-group">
            <label>Your Name</label>
            <div class="input-wrap">
              <i class="fas fa-user"></i>
              <input type="text" id="signupName" placeholder="Full name"/>
            </div>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <div class="input-wrap">
              <i class="fas fa-envelope"></i>
              <input type="email" id="signupEmail" placeholder="Your email"/>
            </div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="input-wrap">
              <i class="fas fa-lock"></i>
              <input type="password" id="signupPassword" placeholder="At least 6 characters"/>
            </div>
          </div>
          <button class="btn-auth" id="signupBtn" onclick="doSignup()">
            <i class="fas fa-user-plus"></i> Create Account
          </button>
          <p class="auth-footer">Already have an account? <a onclick="switchTab('login')" style="cursor:pointer">Login</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/shopire-chat.js" defer></script>
  <script src="js/login.js"></script>
</body>
</html>
