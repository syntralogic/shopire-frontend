<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout – SHOPIRE</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/checkout.css"/>
</head>
<body>
  <script src="js/shopire-nav.js" defer></script>

  <div class="container">
    <h1><i class="fas fa-credit-card" style="color:var(--red)"></i> Checkout</h1>
    <div id="mainMsg" class="msg"></div>
    <div class="checkout-grid">
      <div>
        <div class="card">
          <h2><i class="fas fa-map-marker-alt" style="color:var(--red);margin-right:8px"></i>Delivery Details</h2>
          <div class="form-row">
            <div class="form-group">
              <label>Your Name *</label>
              <input type="text" id="dName" placeholder="Full name"/>
            </div>
            <div class="form-group">
              <label>Phone *</label>
              <input type="text" id="dPhone" placeholder="03XX-XXXXXXX"/>
            </div>
          </div>
          <div class="form-group">
            <label>Email *</label>
            <input type="email" id="dEmail" placeholder="email@example.com"/>
          </div>
          <div class="form-group">
            <label>Full Address *</label>
            <textarea id="dAddress" placeholder="Street address, area..."></textarea>
          </div>
          <div class="form-group">
            <label>City</label>
            <input type="text" id="dCity" placeholder="Karachi, Lahore, Islamabad..."/>
          </div>
        </div>
      </div>

      <div>
        <div class="card">
          <h2><i class="fas fa-shopping-bag" style="color:var(--red);margin-right:8px"></i>Order Summary</h2>
          <div id="orderItems"><div class="empty-msg"><i class="fas fa-spinner fa-spin"></i> Loading cart...</div></div>
          <div id="orderSummary" style="display:none">
            <div class="summary-row"><span>Subtotal</span><span id="subtotal">—</span></div>
            <div class="summary-row"><span>Shipping</span><span style="color:green;font-weight:700">FREE</span></div>
            <div class="summary-row total"><span>Total</span><span id="orderTotal" style="color:var(--red)">—</span></div>
          </div>
          <button class="btn-place" id="placeBtn" onclick="placeOrder()">
            <i class="fas fa-check-circle"></i> Place Order
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/shopire-chat.js" defer></script>
  <script src="js/checkout.js"></script>
</body>
</html>
