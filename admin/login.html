<!DOCTYPE html>
<html lang="en">
<head>
<script>
  (function(){
    if(localStorage.getItem('shopire_dark')==='true'){
      document.documentElement.setAttribute('data-theme','dark');
    }
  })();
</script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login – SHOPIRE</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="/admin/css/admin-login.css"/>
</head>
<body>
  <div class="login-wrap">
    <div class="security-badge">
      <i class="fas fa-shield-alt"></i>
      Secure Admin Access Only
    </div>
    <div class="login-card">
      <div class="login-header">
        <div class="admin-logo">
          <div class="logo-icon"><i class="fas fa-bolt"></i></div>
          <div class="logo-text">
            <span>SHOPIRE</span>
            <span class="logo-admin-tag">Admin Panel</span>
          </div>
        </div>
        <p>Authorized admins only</p>
      </div>
      <div class="login-body">
        <div class="msg" id="loginMsg"></div>
        <div class="form-group">
          <label>Admin Email</label>
          <div class="input-wrap">
            <i class="fas fa-envelope icon"></i>
            <input type="email" id="adminEmail" placeholder="admin@shopire.com" autocomplete="email"/>
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock icon"></i>
            <input type="password" id="adminPassword" placeholder="••••••••" autocomplete="current-password"
              onkeydown="if(event.key==='Enter') doAdminLogin()"/>
          </div>
        </div>
        <button class="btn-login" id="loginBtn" onclick="doAdminLogin()">
          <i class="fas fa-shield-alt"></i> Admin Login
        </button>
      </div>
      <div class="login-footer">
        <a href="../index.html" class="back-link">
          <i class="fas fa-arrow-left"></i> Back to main website
        </a>
      </div>
    </div>
  </div>

  <script src="/admin/js/api.js"></script>
  <script src="/admin/js/admin-login.js"></script>
</body>
</html>
